<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciamento de Pedidos</title>
    <link rel="stylesheet" href="/src/style.css" />
    <meta 
    http-equiv="Content-Security-Policy" 
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
  >
  </head>
  <body>
    <div id="app">
      <header class="topo">
        <h1>Gerenciamento de Pedidos</h1>
        <div class="topo-acoes">
          <button id="botao-tema" class="botao botao-secundario" type="button" title="Alternar modo noturno">🌑</button>
          <button id="botao-novo-pedido" class="botao botao-primario" type="button">+ Novo pedido</button>
        </div>
      </header>

      <section class="resumo" id="resumo-cards" aria-label="Resumo dos pedidos"></section>

      <section class="filtros">
        <input id="filtro-busca" type="search" placeholder="Buscar por cliente..." aria-label="Buscar por cliente" />
        <select id="filtro-status" aria-label="Filtrar por status">
          <option value="todos">Todos os status</option>
          <option value="pendente">Pendente</option>
          <option value="em_andamento">Em andamento</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </section>

      <section aria-label="Lista de pedidos">
        <table class="tabela-pedidos">
          <thead>
            <tr>
              <th>Mesa</th>
              <th>Atendente</th>
              <th>Cliente</th>
              <th>Itens</th>
              <th>Total</th>
              <th>Status</th>
              <th>Criado em</th>
              <th class="coluna-acoes">Ações</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela-pedidos"></tbody>
        </table>
        <p id="mensagem-lista-vazia" class="lista-vazia" hidden>Nenhum pedido encontrado.</p>
      </section>
    </div>

    <dialog id="dialogo-pedido">
      <form id="formulario-pedido">
        <h2 id="titulo-dialogo-pedido">Novo pedido</h2>

        <div class="campos-linha">
          <label class="campo">
            <span>Mesa</span>
            <input id="campo-mesa" type="text" required maxlength="20" placeholder="Ex: Mesa 5" />
          </label>

          <label class="campo">
            <span>Atendente / Garçom</span>
            <select id="campo-atendente" required></select>
          </label>
        </div>

        <label class="campo">
          <span>Cliente</span>
          <input id="campo-cliente" type="text" required maxlength="120" placeholder="Nome do cliente" />
        </label>

        <label class="campo">
          <span>Observações (opcional)</span>
          <textarea id="campo-observacoes" rows="2" maxlength="500"></textarea>
        </label>

        <div class="itens-cabecalho">
          <span>Itens do pedido</span>
          <button id="botao-adicionar-item" class="botao botao-secundario" type="button">+ Item</button>
        </div>

        <div id="lista-itens" class="lista-itens"></div>

        <p class="total-formulario">
          Total: <strong id="total-formulario">R$ 0,00</strong>
        </p>

        <p id="erro-formulario" class="erro" hidden></p>

        <div class="acoes-dialogo">
          <button id="botao-cancelar-pedido" class="botao botao-secundario" type="button">Cancelar</button>
          <button id="botao-salvar-pedido" class="botao botao-primario" type="submit">Salvar pedido</button>
        </div>
      </form>
    </dialog>

    <dialog id="dialogo-detalhes-pedido">
      <div class="detalhes-conteudo">
        <div class="detalhes-cabecalho">
          <div>
            <h2 id="detalhes-titulo">Pedido</h2>
            <span id="detalhes-selo-status" class="selo-status"></span>
          </div>
          <button id="botao-fechar-detalhes" class="botao botao-secundario botao-icone" type="button" title="Fechar modal">✕</button>
        </div>

        <dl class="detalhes-grade">
          <div>
            <dt>Atendente responsável</dt>
            <dd id="detalhes-atendente"></dd>
          </div>
          <div>
            <dt>Cliente</dt>
            <dd id="detalhes-cliente"></dd>
          </div>
          <div>
            <dt>Criado em</dt>
            <dd id="detalhes-criado-em"></dd>
          </div>
          <div>
            <dt>Última atualização</dt>
            <dd id="detalhes-atualizado-em"></dd>
          </div>
        </dl>

        <div>
          <h3>Itens do pedido</h3>
          <ul id="detalhes-lista-itens" class="detalhes-itens"></ul>
          <p class="detalhes-total">Total: <strong id="detalhes-total"></strong></p>
        </div>

        <div>
          <h3>Observações</h3>
          <p id="detalhes-observacoes" class="detalhes-observacoes"></p>
        </div>

        <div class="acoes-dialogo">
          <button id="botao-detalhes-cancelar-pedido" class="botao botao-perigo" type="button">Cancelar pedido</button>
          <button id="botao-detalhes-concluir-pedido" class="botao botao-secundario" type="button">Concluir</button>
          <button id="botao-detalhes-editar" class="botao botao-secundario" type="button">Editar</button>
          <button id="botao-detalhes-fechar" class="botao botao-primario" type="button">Fechar</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
